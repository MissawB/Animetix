name: Animetix Security Audit

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger
  pull_request:
    branches: [ main ]
    paths:
      # Code paths too: a Bandit regression in application code (or a Dockerfile
      # smell) must fail the PR, not sit until the nightly cron up to 24h later.
      - 'backend/**'
      - 'deploy/**'
      - 'requirements.txt'
      - 'frontend/package-lock.json'
      - '.github/workflows/security_audit.yml'

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    # No "Free Disk Space" step: it only existed to make room for the torch +
    # requirements install, which bandit (static) doesn't need — see below.

    - name: Set up Python
      uses: actions/setup-python@f6ec4389a5e1507a06a23e416f69963ed1361f32 # v5.3.0
      with:
        python-version: '3.12'
        cache: 'pip'

    # Bandit is static AST analysis — it never imports the project, so the app's
    # dependencies (torch + requirements, ~5 min) are NOT installed here. This
    # keeps the job cheap enough to run on every backend PR (see paths above).
    - name: Static Analysis (Bandit)
      run: |
        pip install bandit
        bandit -r backend/ -ll -ii
      # -ll: logical lines
      # -ii: include low confidence

  frontend-security:
    name: Frontend Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c080011e81310111e3070b4f # v4.1.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
    - name: Install Node.js dependencies
      working-directory: ./frontend
      run: npm ci --legacy-peer-deps

    - name: Run Frontend Vulnerability Scan
      working-directory: ./frontend
      run: npm audit --audit-level=high

  container-security:
    name: Container Image Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Scan Dockerfile
      uses: hadolint/hadolint-action@54c5989f53856230f8b1c1c1f4c75953046f8d38 # v3.1.0
      with:
        dockerfile: deploy/Dockerfile
